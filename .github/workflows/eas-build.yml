name: EAS Build & Submit

# Triggered manually, or automatically on tags like v1.2.0. Requires the
# EXPO_TOKEN secret (from `eas login` / expo.dev account settings) plus the
# platform credentials configured in EAS (`eas credentials`).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options: [development, preview, production]
      platform:
        description: "Target platform"
        required: true
        default: "all"
        type: choice
        options: [ios, android, all]
      submit:
        description: "Submit to store after build"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (tag push defaults to production/all)
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive --no-wait

      - name: Submit to stores
        if: ${{ github.event.inputs.submit == 'true' }}
        run: |
          eas submit \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive
